<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Samsung One", Helvetica, Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center;
    transition: opacity 3s; opacity: 0; }
  .bg.on { opacity: 1; }
  .shade { position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0) 35%, rgba(0,0,0,0) 65%, rgba(0,0,0,.5)); }
  .tr { position: absolute; top: 60px; right: 80px; text-align: right; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #time { font-size: 150px; font-weight: 300; line-height: 1; }
  #date { font-size: 40px; margin-top: 10px; }
  #wx { font-size: 34px; margin-top: 8px; opacity: .9; }
</style>
</head>
<body>
<div class="bg" id="bg0"></div>
<div class="bg" id="bg1"></div>
<div class="shade"></div>
<div class="tr">
  <div id="time"></div>
  <div id="date"></div>
  <div id="wx"></div>
</div>
<script>
// Change these to your city. Find coordinates at open-meteo.com.
var LAT = 40.76, LON = -111.89; // Salt Lake City
var PHOTO_MINUTES = 5;

var WX = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',
  61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

function clock() {
  var d = new Date();
  document.getElementById('time').textContent = d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).replace(/\s?[AP]M/, '');
  document.getElementById('date').textContent = d.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
}

function weather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&temperature_unit=fahrenheit&timezone=auto&forecast_days=1')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var c = j.current, d = j.daily;
      document.getElementById('wx').textContent = Math.round(c.temperature_2m) + '° ' + (WX[c.weather_code] || '') +
        ' · H ' + Math.round(d.temperature_2m_max[0]) + '° L ' + Math.round(d.temperature_2m_min[0]) + '°' +
        ' · ' + d.precipitation_probability_max[0] + '% rain';
    })
    .catch(function () {}); // keep the last reading if offline
}

// Cross-fade between two layers so there is never a blank frame.
var layer = 0;
function photo() {
  var url = 'https://picsum.photos/1920/1080?random=' + Date.now();
  var img = new Image();
  img.onload = function () {
    var next = document.getElementById('bg' + (1 - layer));
    next.style.backgroundImage = 'url(' + url + ')';
    next.classList.add('on');
    document.getElementById('bg' + layer).classList.remove('on');
    layer = 1 - layer;
  };
  img.src = url;
}

clock(); weather(); photo();
setInterval(clock, 1000);
setInterval(weather, 15 * 60 * 1000);
setInterval(photo, PHOTO_MINUTES * 60 * 1000);
</script>
</body>
</html>
