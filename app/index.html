<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff;
    font-family: "Samsung One", Helvetica, Arial, sans-serif; }
  .bg { position: absolute; inset: 0; background-size: cover; background-position: center;
    transition: opacity 3s; opacity: 0; }
  .bg.on { opacity: 1; }
  .shade { position: absolute; inset: 0; transition: background 1s;
    background: linear-gradient(to bottom, rgba(0,0,0,.45), rgba(0,0,0,0) 35%, rgba(0,0,0,0) 65%, rgba(0,0,0,.5)); }
  body.home .shade { background: rgba(0,0,0,.55); }
  .tr { position: absolute; top: 60px; right: 80px; text-align: right; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  #time { font-size: 150px; font-weight: 300; line-height: 1; }
  #date { font-size: 40px; margin-top: 10px; }
  #wx { font-size: 34px; margin-top: 8px; opacity: .9; }
  #tiles { position: absolute; left: 80px; right: 80px; bottom: 120px; display: flex; flex-wrap: wrap; gap: 30px;
    transition: opacity .4s; }
  body:not(.home) #tiles { opacity: 0; }
  .tile { width: 260px; height: 170px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700; transition: transform .15s; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  .tile.focus { transform: scale(1.1); outline: 6px solid #fff; }
</style>
</head>
<body class="home">
<div class="bg" id="bg0"></div>
<div class="bg" id="bg1"></div>
<div class="shade"></div>
<div class="tr">
  <div id="time"></div>
  <div id="date"></div>
  <div id="wx"></div>
</div>
<div id="tiles"></div>
<script>
// Change these to your city. Find coordinates at open-meteo.com.
var LAT = 40.76, LON = -111.89; // Salt Lake City
var PHOTO_MINUTES = 5;
var IDLE_MINUTES = 3; // no button presses for this long = dashboard

// Tiles. IDs come from the TV (http://<tv-ip>:8001/api/v2/applications/<id>).
var APPS = [
  {name: 'Netflix',    id: '3201907018807', color: '#e50914'},
  {name: 'Hulu',       id: '3201601007625', color: '#1ce783', text: '#000'},
  {name: 'HBO Max',    id: '3202301029760', color: '#002be7'},
  {name: 'ESPN',       id: '3201708014618', color: '#cc0000'},
  {name: 'Peacock',    id: '3202006020991', color: '#111'},
  {name: 'YouTube TV', id: '3201707014489', color: '#282828'}
];

var WX = {0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Cloudy',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Drizzle',
  61:'Rain',63:'Rain',65:'Heavy rain',71:'Snow',73:'Snow',75:'Heavy snow',80:'Showers',81:'Showers',82:'Heavy showers',
  95:'Thunderstorm',96:'Thunderstorm',99:'Thunderstorm'};

function clock() {
  var d = new Date();
  document.getElementById('time').textContent = d.toLocaleTimeString('en-US', {hour: 'numeric', minute: '2-digit'}).replace(/\s?[AP]M/, '');
  document.getElementById('date').textContent = d.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
}

function weather() {
  fetch('https://api.open-meteo.com/v1/forecast?latitude=' + LAT + '&longitude=' + LON +
    '&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
    '&temperature_unit=fahrenheit&timezone=auto&forecast_days=1')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var c = j.current, d = j.daily;
      document.getElementById('wx').textContent = Math.round(c.temperature_2m) + '° ' + (WX[c.weather_code] || '') +
        ' · H ' + Math.round(d.temperature_2m_max[0]) + '° L ' + Math.round(d.temperature_2m_min[0]) + '°' +
        ' · ' + d.precipitation_probability_max[0] + '% rain';
    })
    .catch(function () {}); // keep the last reading if offline
}

// Cross-fade between two layers so there is never a blank frame.
var layer = 0;
function photo() {
  var url = 'https://picsum.photos/1920/1080?random=' + Date.now();
  var img = new Image();
  img.onload = function () {
    var next = document.getElementById('bg' + (1 - layer));
    next.style.backgroundImage = 'url(' + url + ')';
    next.classList.add('on');
    document.getElementById('bg' + layer).classList.remove('on');
    layer = 1 - layer;
  };
  img.src = url;
}

// Launcher
var tiles = document.getElementById('tiles'), focus = 0;
APPS.forEach(function (a) {
  var t = document.createElement('div');
  t.className = 'tile';
  t.textContent = a.name;
  t.style.background = a.color;
  t.style.color = a.text || '#fff';
  tiles.appendChild(t);
});
function draw() {
  for (var i = 0; i < tiles.children.length; i++) tiles.children[i].classList.toggle('focus', i === focus);
}
function launch(a) {
  if (window.tizen) tizen.application.launch(a.id, null, function (e) { alert(a.name + ': ' + e.message); });
  else console.log('launch ' + a.id); // preview on a computer
}

var idleTimer;
function wake() {
  document.body.className = 'home';
  clearTimeout(idleTimer);
  idleTimer = setTimeout(function () { document.body.className = ''; }, IDLE_MINUTES * 60 * 1000);
}

var PER_ROW = 6;
window.addEventListener('keydown', function (e) {
  if (document.body.className !== 'home') { wake(); e.preventDefault(); return; } // first press only wakes
  wake();
  var n = APPS.length;
  if (e.keyCode === 37) focus = (focus + n - 1) % n;
  else if (e.keyCode === 39) focus = (focus + 1) % n;
  else if (e.keyCode === 38) focus = Math.max(0, focus - PER_ROW);
  else if (e.keyCode === 40) focus = Math.min(n - 1, focus + PER_ROW);
  else if (e.keyCode === 13) launch(APPS[focus]);
  else if (e.keyCode === 10009) document.body.className = ''; // Back = dashboard, never exit
  else return;
  e.preventDefault();
  draw();
});
// Coming back from Netflix etc. lands on the tiles.
document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });

draw(); wake(); clock(); weather(); photo();
setInterval(clock, 1000);
setInterval(weather, 15 * 60 * 1000);
setInterval(photo, PHOTO_MINUTES * 60 * 1000);
</script>
</body>
</html>
